name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Panel layout
        run: node tools/test-layout.mjs
      - name: Model smoke test
        run: node tools/test-model.mjs
      - name: Levels and solutions
        run: node tools/validate-levels.mjs
